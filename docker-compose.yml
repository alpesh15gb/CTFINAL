services:
  cartunez:
    build: .
    container_name: cartunez-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: cartunez-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - cartunez
