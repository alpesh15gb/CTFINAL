services:
  cartunez:
    build: .
    container_name: cartunez-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3015:3000"
    env_file: .env.local
    environment:
      - NODE_ENV=production
      - MEDUSA_BACKEND_URL=http://cartunez-medusa:9000
    depends_on:
      medusa:
        condition: service_healthy

  medusa-db:
    image: postgres:16-alpine
    container_name: cartunez-medusa-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_secret_change_me
      POSTGRES_DB: medusa_cartunez
    volumes:
      - medusa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_cartunez"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa-redis:
    image: redis:7-alpine
    container_name: cartunez-medusa-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - medusa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa:
    build:
      context: .
      dockerfile: Dockerfile.medusa
    container_name: cartunez-medusa
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://medusa:medusa_secret_change_me@medusa-db:5432/medusa_cartunez
      REDIS_URL: redis://medusa-redis:6379
      STORE_CORS: "http://localhost:3000,http://localhost:3015,http://cartunez.in,https://cartunez.in,http://www.cartunez.in,https://www.cartunez.in"
      ADMIN_CORS: "http://localhost:3000,http://localhost:3015,http://cartunez.in,https://cartunez.in,http://www.cartunez.in,https://www.cartunez.in"
      PORT: 9000
    depends_on:
      medusa-db:
        condition: service_healthy
      medusa-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  medusa_db_data:
  medusa_redis_data:
