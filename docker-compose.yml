services:
  cartunez:
    build: .
    container_name: cartunez-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3015:3000"
    env_file: .env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://cartunez-medusa:9000
    depends_on:
      medusa:
        condition: service_healthy

  # Medusa PostgreSQL (port 5434 to avoid conflict with existing 5432/5433)
  medusa-db:
    image: postgres:16-alpine
    container_name: cartunez-medusa-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_secret_change_me
      POSTGRES_DB: medusa_cartunez
    volumes:
      - medusa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_cartunez"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for Medusa
  medusa-redis:
    image: redis:7-alpine
    container_name: cartunez-medusa-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - medusa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Medusa backend
  medusa:
    build:
      context: .
      dockerfile: Dockerfile.medusa
      # Bake the public backend URL into the admin UI. Rebuild with your
      # value once nginx exposes the backend, e.g.:
      #   docker compose build --build-arg MEDUSA_ADMIN_BACKEND=https://api.example.com medusa
      # args:
      #   MEDUSA_ADMIN_BACKEND: https://api.example.com
    container_name: cartunez-medusa
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      DATABASE_URL: postgres://medusa:medusa_secret_change_me@medusa-db:5432/medusa_cartunez
      REDIS_URL: redis://medusa-redis:6379
      JWT_SECRET: change_this_to_a_long_random_string
      COOKIE_SECRET: change_this_to_another_random_string
      PORT: 9000
    depends_on:
      medusa-db:
        condition: service_healthy
      medusa-redis:
        condition: service_healthy
    healthcheck:
      # NOTE: node:20-alpine ships no `curl`; busybox `wget` is used instead.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

volumes:
  medusa_db_data:
  medusa_redis_data:
